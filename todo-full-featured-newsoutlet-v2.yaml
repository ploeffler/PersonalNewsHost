# TODO-Liste v2: PersonalNewsHost -> "Full featured Newsoutlet"
# v2 = v1 (Basis: main) + Redaktion mit virtuellen Mitarbeitern, erweitertes Fact-Checking,
#      externe Text-/Videoanbieter, News-Shows, realistische KI-Hosts mit Lipsync
# Format: YAML (maschinenlesbar). Reihenfolge ergibt sich aus depends_on.
# Status-Werte: todo | in_progress | done | blocked
# Hinweis: Dateipfade sind Annahmen. Jede Aufgabe beginnt mit "inspect",
# damit der ausfuehrende Agent zuerst den echten Code-Stand prueft.

meta:
  project: PersonalNewsHost
  repo: https://github.com/ploeffler/PersonalNewsHost
  target_branch: Full-featured-Newsoutlet
  base: main
  language_of_output: de
  license: GPL-3.0
  schema_version: 2
  version: 2
  extends: v1
  added_scope:
    - virtuelle Redaktion (Abteilungen, Mitarbeiter)
    - erweitertes Fact-Checking
    - Textanalyse und Nachrichtenformulierung durch externe Anbieter
    - Videoerzeugung durch externe Anbieter
    - News-Show-Formate
    - KI-Hosts/Avatare mit echtem Lipsync

execution_rules:
  - Eine Aufgabe darf erst starten, wenn alle Eintraege in depends_on den Status done haben.
  - Jede Aufgabe mit externem Anbieter wird zuerst gegen den Mock-Provider (T100) entwickelt und getestet.
  - Bei jeder Unklarheit zum Ist-Code zuerst inspizieren (T001), nicht raten.

