open_decisions:
  - id: D1
    question: Welche externen Anbieter fuer Text/Analyse (Kandidaten festlegen, Kosten/Nutzungsbedingungen pruefen)?
    blocks: [T102, T132]
  - id: D2
    question: Welches monatliche Budget in EUR ist fuer externe Dienste erlaubt (0 = nur Free-Tier/Fallback)?
    blocks: [T101, T144, T166]
  - id: D3
    question: Avatar-Weg - gehosteter Avatar-Dienst oder Open-Source-Modell auf eigener/externer GPU?
    blocks: [T160, T161]
  - id: D4
    question: Duerfen Stimmen geklont werden (nur mit eigener, dokumentierter Einwilligung)?
    blocks: [T163]
  - id: D5
    question: Soll menschliche Freigabe fuer unsichere Meldungen verpflichtend sein?
    blocks: [T125, T128]

global_constraints:
  - id: C1
    rule: Der Kernbetrieb bleibt bei 0 EUR pro Monat. Externe Anbieter sind ausschliesslich optional (Opt-in), haben ein hartes Budgetlimit in der Konfiguration (Standard 0) und werden bei Limit, Fehler oder fehlendem Secret durch lokale/freie Fallbacks ersetzt.
  - id: C2
    rule: Keine Zugangsdaten, Tokens oder Secrets im Repository; ausschliesslich GitHub Secrets verwenden.
  - id: C3
    rule: Bestehende Funktionen (Sendung, Webseite, Video-RSS, Untertitel, Telegram) duerfen nicht regredieren.
  - id: C4
    rule: Jede neue Funktion ist ueber config.json abschaltbar; config.example.json wird mitgepflegt.
  - id: C5
    rule: Jede neue Funktion erhaelt Tests unter tests/ und einen Eintrag in docs/guide/.
  - id: C6
    rule: Quellenangaben bleiben fuer jede Meldung sichtbar; es wird keine Faktenpruefung vorgetäuscht.
  - id: C7
    rule: Workflow-Laufzeiten und Artefaktgroessen innerhalb der kostenlosen GitHub-Actions- und Pages-Grenzen halten.
  - id: C8
    rule: Lizenz- und Nutzungsbedingungen aller Feeds, Bilder und Dienste beachten und dokumentieren.
  - id: C9
    rule: Synthetische Medien (KI-Avatare, KI-Stimmen, KI-generierte Clips) werden im Bild sichtbar, in den Metadaten und auf der Webseite als KI-generiert gekennzeichnet. Transparenzpflichten (u. a. EU-KI-Verordnung) werden geprueft und dokumentiert.
  - id: C10
    rule: Keine Nachbildung realer Personen (Gesicht, Stimme, Name); virtuelle Mitarbeiter und Hosts sind fiktiv. Stimmklone nur aus eigener, dokumentierter Einwilligung. Keine Darstellung von KI-Material als echtes Ereignisfootage; keine falsche Behauptung von Live-Uebertragung.
  - id: C11
    rule: An externe Anbieter werden nur oeffentliche Feed-Inhalte und notwendige Metadaten gesendet; nie Secrets oder personenbezogene Daten. Verwendete Anbieter, Nutzungsbedingungen (Training, Weiterverwendung, kommerzielle Nutzung) und Datenfluesse werden in der Datenschutzdoku aufgefuehrt.
  - id: C12
    rule: Fact-Check-Ergebnisse sind Indizien mit Belegen und Konfidenz, keine Wahrheitsgarantie. Nicht ausreichend bestaetigte Meldungen werden gekennzeichnet, zurueckgehalten oder verworfen, nie stillschweigend als geprueft ausgegeben.
  - id: C13
    rule: Jede externe Leistung liegt hinter einem Provider-Interface mit Timeout, Wiederholung, Kostenzaehler, Fallback und Mock-Variante. Inhalte aus Feeds gelten als nicht vertrauenswuerdig (Prompt-Injection-Schutz).

