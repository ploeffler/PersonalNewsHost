name: Probe LLM-Grenzfallprüfung
'on':
  push:
    branches:
    - exp/languagemodels-vergleich
permissions:
  contents: read
env:
  LLAMA_CPP_TAG: b12340
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v5
      with:
        ref: feat/llm-pair-judge
    - name: Aktuellen Nachrichtenspeicher von main holen
      run: git fetch --depth=1 origin main && git checkout origin/main -- docs/news-store.json
    - name: Plan language-model checks for borderline pairs
      id: pairs
      run: python3 scripts/llm_pair_judge.py --plan
    - name: Identify runner CPU for the llama.cpp build cache
      if: fromJSON(steps.pairs.outputs.pending || '0') > 0
      id: cpu
      run: echo "key=$(grep -m1 -E '^(model name|flags)' /proc/cpuinfo | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
    - name: Restore llama.cpp build
      if: fromJSON(steps.pairs.outputs.pending || '0') > 0
      uses: actions/cache@v4
      with:
        path: ~/llama
        key: llama-cpp-${{ env.LLAMA_CPP_TAG }}-${{ steps.cpu.outputs.key }}
    - name: Restore language model
      if: fromJSON(steps.pairs.outputs.pending || '0') > 0
      uses: actions/cache@v4
      with:
        path: ~/models
        key: llm-qwen3-4b-instruct-2507-q4km-v1
    - name: Start local language model
      if: fromJSON(steps.pairs.outputs.pending || '0') > 0
      id: llm
      continue-on-error: true
      timeout-minutes: 8
      run: "if [ ! -x ~/llama/build/bin/llama-server ]; then\n  git clone --depth 1 --branch \"$LLAMA_CPP_TAG\" https://github.com/ggml-org/llama.cpp ~/llama/src\n  cmake -S ~/llama/src -B ~/llama/build\
        \ -DGGML_NATIVE=ON -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release > /dev/null\n  cmake --build ~/llama/build --target llama-server -j 4 > /dev/null\nfi\nmodel=~/models/Qwen_Qwen3-4B-Instruct-2507-Q4_K_M.gguf\n\
        if [ ! -s \"$model\" ]; then\n  python3 -m pip install --disable-pip-version-check -q huggingface_hub\n  python3 -c \"from huggingface_hub import hf_hub_download as d; d('bartowski/Qwen_Qwen3-4B-Instruct-2507-GGUF','Qwen_Qwen3-4B-Instruct-2507-Q4_K_M.gguf',local_dir='$HOME/models')\"\
        \nfi\nnohup ~/llama/build/bin/llama-server -m \"$model\" -c 4096 -t 4 --jinja --port 8080 > /tmp/llama-server.log 2>&1 &\nfor i in $(seq 1 90); do curl -sf http://127.0.0.1:8080/health > /dev/null\
        \ && exit 0; sleep 1; done\ntail -20 /tmp/llama-server.log; exit 1\n"
    - name: 'Probe: größeres Zeitbudget'
      run: 'python3 - <<''PY''

        import json

        c=json.load(open(''config.json''))

        c[''editorial''][''pipeline''][''llm_pairs''][''time_budget_seconds'']=600

        json.dump(c,open(''config.json'',''w''))

        PY'
    - name: Check borderline pairs with the language model
      if: steps.llm.outcome == 'success'
      continue-on-error: true
      timeout-minutes: 12
      run: python3 scripts/llm_pair_judge.py --judge
    - name: Ergebnis
      if: always()
      run: "python3 - <<'PY'\nimport json,importlib.util,time\nspec=importlib.util.spec_from_file_location('ep','scripts/editorial_pipeline.py');p=importlib.util.module_from_spec(spec);spec.loader.exec_module(p)\n\
        store=json.load(open('docs/news-store.json'));now=store['updated_at']\nd=p.load_pair_decisions('docs/event-pairs.json')\nprint('Entscheidungen:',len(d),'davon ja:',sum(d.values()))\nfor dec in (dict(),d):\n\
        \    r=p.prepare(store,now,pair_decisions=dec)\n    print('Gruppen mit mehreren Medien:',sum(p.publisher_count(r,g)>1 for g in r['groups']))\nPY\ngrep -i -E 'error|system_info' /tmp/llama-server.log\
        \ | head -5 || true"
