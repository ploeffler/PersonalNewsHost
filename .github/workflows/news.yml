name: Generate news video
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: personalnewshost-publish
  cancel-in-progress: false
env:
  PIP_CONSTRAINT: ${{ github.workspace }}/requirements-constraints.txt

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The concurrency lock is acquired before checkout. Read the newest
          # publication even if this scheduled event waited in the queue.
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Load private configuration
        env:
          PERSONALNEWSHOST_CONFIG: ${{ secrets.PERSONALNEWSHOST_CONFIG }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          raw = os.environ.get("PERSONALNEWSHOST_CONFIG", "").strip()
          if raw:
              config = json.loads(raw)
              if not isinstance(config, dict):
                  raise ValueError("PERSONALNEWSHOST_CONFIG must be a JSON object")
              Path("config.json").write_text(json.dumps(config, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              print("Private repository configuration loaded from Actions secret.")
          else:
              print("No private configuration secret; using public defaults.")
          PY
      - name: Mask private configuration fields before further processing
        run: python3 scripts/security_checks.py --mask-config config.json
      - name: Validate production configuration
        run: |
          python3 -m pip install --disable-pip-version-check -r requirements.txt
          python3 scripts/validate_config.py
      - name: Test provider configuration contracts
        run: python3 -m unittest discover -s tests
      - name: Check configured production schedule
        id: schedule
        run: python3 scripts/check_schedule.py
      - name: Restore cached Ubuntu packages
        if: steps.schedule.outputs.due == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/pnh-debs
          key: pnh-ubuntu2404-amd64-debs-v1
      - name: Restore Python download cache
        if: steps.schedule.outputs.due == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: pnh-pip-ubuntu2404-py3-v1
      - name: Restore Piper voice model
        if: steps.schedule.outputs.due == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: models/
          key: pnh-piper-de-thorsten-high-v1
      - name: Install free local tools
        if: steps.schedule.outputs.due == 'true'
        run: |
          set -euo pipefail
          missing=()
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then missing+=(ffmpeg); fi
          if ! command -v espeak-ng >/dev/null; then missing+=(espeak-ng); fi
          if (( ${#missing[@]} )); then
            mkdir -p /tmp/pnh-debs
            # Reuse previously downloaded .deb archives before contacting mirrors.
            sudo cp -n /tmp/pnh-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
            # Avoid the sometimes very slow Azure mirror; try Ubuntu's primary
            # archive first, then a different official mirror if necessary.
            sudo cp /etc/apt/sources.list.d/ubuntu.sources /tmp/pnh-ubuntu.sources.bak
            for mirror in https://archive.ubuntu.com/ubuntu https://mirrors.edge.kernel.org/ubuntu; do
              echo "Trying Ubuntu mirror: $mirror"
              sudo sed -E "s#https?://(azure.archive.ubuntu.com|archive.ubuntu.com|security.ubuntu.com|mirrors.edge.kernel.org)/ubuntu/?#${mirror}#g" /tmp/pnh-ubuntu.sources.bak | sudo tee /etc/apt/sources.list.d/ubuntu.sources >/dev/null
              # Keep security repositories from the runner intact; replace only
              # archive endpoints and refresh indexes for the selected mirror.
              if timeout 180s sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 &&
                 timeout 600s sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends -o Dpkg::Use-Pty=0 -o Acquire::Retries=2 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 "${missing[@]}"; then
                break
              fi
              echo "::warning::Package install failed on $mirror; trying next mirror"
            done
          fi
          mkdir -p /tmp/pnh-debs
          sudo find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -n {} /tmp/pnh-debs/ \;
          command -v ffmpeg
          command -v ffprobe
          command -v espeak-ng
          ffmpeg -version | head -n 1
          espeak-ng --version
      - name: Install neural speech engine
        if: steps.schedule.outputs.due == 'true'
        run: python3 -m pip install --disable-pip-version-check --prefer-binary piper-tts Pillow
      - name: Smoke-test FFmpeg intro modes
        if: steps.schedule.outputs.due == 'true'
        run: python3 -m unittest discover -s tests -p test_video_smoke.py -v
      - name: Install offline AI image upscaler
        if: steps.schedule.outputs.due == 'true'
        run: |
          python3 -m pip install --disable-pip-version-check --prefer-binary opencv-contrib-python-headless numpy
          mkdir -p models
          if [ ! -s models/FSRCNN_x2.pb ]; then
            curl -fL --retry 3 --connect-timeout 15 --max-time 90 \
              "https://raw.githubusercontent.com/Saafke/FSRCNN_Tensorflow/master/models/FSRCNN_x2.pb" \
              -o models/FSRCNN_x2.pb || rm -f models/FSRCNN_x2.pb
          fi
          python3 - <<'PY'
          import cv2
          from pathlib import Path
          print("OpenCV:", cv2.__version__)
          model = Path("models/FSRCNN_x2.pb")
          if model.is_file():
              sr = cv2.dnn_superres.DnnSuperResImpl_create()
              sr.readModel(str(model))
              sr.setModel("fsrcnn", 2)
              print("Offline FSRCNN x2 model ready")
          else:
              print("::warning::FSRCNN model unavailable; conservative fallback will be used")
          PY
      - name: Download German Piper voice
        if: steps.schedule.outputs.due == 'true'
        run: |
          mkdir -p models
          base="https://huggingface.co/rhasspy/piper-voices/resolve/main/de/de_DE/thorsten/high"
          if [ ! -s models/de_DE-thorsten-high.onnx ]; then
            curl -fL --retry 3 --connect-timeout 15 --max-time 180 "$base/de_DE-thorsten-high.onnx" -o models/de_DE-thorsten-high.onnx || true
          fi
          if [ ! -s models/de_DE-thorsten-high.onnx.json ]; then
            curl -fL --retry 3 --connect-timeout 15 --max-time 60 "$base/de_DE-thorsten-high.onnx.json" -o models/de_DE-thorsten-high.onnx.json || true
          fi
          if [ ! -s models/de_DE-thorsten-high.onnx ] || [ ! -s models/de_DE-thorsten-high.onnx.json ]; then
            rm -f models/de_DE-thorsten-high.onnx models/de_DE-thorsten-high.onnx.json
            echo "Piper model unavailable; using eSpeak fallback"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.schedule.outputs.due == 'true'
        with:
          node-version: '22'
      - name: Install local rdrr article extractor
        if: steps.schedule.outputs.due == 'true'
        run: |
          node --version
          npm install --global --no-audit --no-fund rdrr@0.7.0
          rdrr --help >/dev/null
      - name: Store RSS messages from the last 24 hours
        if: steps.schedule.outputs.due == 'true'
        run: |
          rm -f docs/editorial-report.json
          python3 scripts/collect_news.py
      - name: Generate latest bulletin
        id: production
        if: steps.schedule.outputs.due == 'true'
        run: |
          rm -f docs/latest.mp4
          python3 -u scripts/generate.py
          test -s docs/latest.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 docs/latest.mp4 | grep -q .
      - name: Mark the approved broadcast groups in the news store
        if: steps.schedule.outputs.due == 'true'
        run: python3 scripts/collect_news.py --annotations-only
      - name: Sync public configuration for settings page
        if: steps.schedule.outputs.due == 'true'
        env:
          PRIVATE_CONFIG_PRESENT: ${{ secrets.PERSONALNEWSHOST_CONFIG != '' }}
        run: |
          if [ "$PRIVATE_CONFIG_PRESENT" = "true" ]; then
            echo 'Private configuration active; not publishing it to GitHub Pages.'
          else
            cp config.json docs/config.json
          fi
      - name: Publish generated files
        if: steps.schedule.outputs.due == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/security_checks.py --outputs docs/
          git add docs/
          if ! git diff --cached --quiet; then
            git commit -m "Publish latest news bulletin"
            git push
          fi
      - name: Send optional Telegram notification
        if: steps.schedule.outputs.due == 'true' && success()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_SECONDARY: ${{ secrets.TELEGRAM_CHAT_ID_SECONDARY }}
          PUBLIC_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python3 scripts/publish_telegram.py
      - name: Check artifact publication boundary
        id: pnh_publication_1
        if: always() && (steps.production.outcome == 'success' || steps.production.outcome == 'failure')
        env:
          PNH_OUTPUT_PATHS: |
            docs/editorial-report.json
        run: python3 scripts/security_checks.py --outputs-env PNH_OUTPUT_PATHS
      - name: Preserve editorial audit even when no story is approved
        if: ${{ (always() && (steps.production.outcome == 'success' || steps.production.outcome == 'failure')) && steps.pnh_publication_1.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: editorial-source-check
          path: docs/editorial-report.json
          if-no-files-found: ignore
          retention-days: 14
