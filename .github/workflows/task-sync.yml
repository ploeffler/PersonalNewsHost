name: Mirror Newsoutlet tasks to GitHub
on:
  push:
    branches: [Full-featured-Newsoutlet]
    paths:
      - 'planning/task-board.json'
      - 'planning/project.json'
      - 'scripts/sync_github_tasks.py'
      - '.github/workflows/task-sync.yml'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: newsoutlet-task-mirror
  cancel-in-progress: false
jobs:
  mirror:
    if: github.ref == 'refs/heads/Full-featured-Newsoutlet'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Synchronize authoritative JSON tasks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_github_tasks.py --repo "$GITHUB_REPOSITORY" --output planning/github-task-map.json
      - name: Preserve GitHub task IDs on development branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add planning/github-task-map.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update GitHub task and milestone mapping'
            git pull --rebase origin Full-featured-Newsoutlet
            git push origin HEAD:Full-featured-Newsoutlet
          fi
