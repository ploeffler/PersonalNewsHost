name: Produce one free chat Reel
run-name: Reel ${{ inputs.output_name }} · ${{ inputs.request_id }}
on:
  workflow_call:
    inputs:
      request:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      station_name:
        description: Stationsname
        type: string
        required: true
      show_name:
        description: Sendungsname
        type: string
        required: true
      host_description:
        description: Beschreibung eines fiktiven erwachsenen Hosts (englische Prompts empfohlen)
        type: string
        required: true
      studio_description:
        description: Beschreibung des Studios/Hintergrunds
        type: string
        required: true
      rss_feed:
        description: Öffentlicher RSS/Atom-Feed ohne Zugangsdaten
        type: string
        required: true
      news_count:
        description: Nachrichtenanzahl (1 bis 5, höchstens 90 Sekunden)
        type: number
        default: 1
        required: true
      output_name:
        description: Ausgabename ohne Pfad (z. B. abend-reel)
        type: string
        required: true
      request_id:
        description: Chat-Auftragskennung zur eindeutigen Zuordnung
        type: string
        default: manual
      test_mode:
        description: Ein kurzes Teststück ohne Live-Nachrichten, echte KI-Modelle
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: chat-reel-worker-${{ github.actor }}
  cancel-in-progress: false
jobs:
  reel:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: Validate request and read bounded public feed
        env:
          REEL_INPUTS: ${{ inputs.request || toJSON(inputs) }}
        run: |
          mkdir -p .reel-work
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.reel_show import normalize_request, prepare
          request = normalize_request(json.loads(os.environ['REEL_INPUTS']))
          Path('.reel-work/request.json').write_text(json.dumps(request))
          prepare(request, Path('.reel-work'))
          PY
      - name: Install CPU runtimes and fixed model code
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg libgl1 libglib2.0-0 fonts-dejavu-core
          python3 scripts/setup_reel_runtime.py
      - name: Restore public image model cache (no videos or prompts)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: image_cache
        with:
          path: ~/.cache/huggingface/hub/models--stabilityai--sd-turbo
          key: reel-sd-turbo-fp16-b261bac6fd2cf515557d5d0707481eafa0485ec2
      - name: Generate fictional host and studio locally
        run: |
          .reel-image/bin/python - <<'PY'
          import json
          from pathlib import Path
          from scripts.reel_models import images
          from argparse import Namespace
          c = json.loads(Path('.reel-work/request.json').read_text())
          images(Namespace(work=Path('.reel-work'), host=c['host_description'], studio=c['studio_description']))
          PY
      - name: Cache only immutable public image weights
        if: steps.image_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/huggingface/hub/models--stabilityai--sd-turbo
          key: reel-sd-turbo-fp16-b261bac6fd2cf515557d5d0707481eafa0485ec2
      - name: Synthesize German speech locally
        run: .reel-image/bin/python scripts/reel_show.py speak
      - name: Animate speaking host with SadTalker on CPU
        run: python3 scripts/reel_models.py animate --work .reel-work --source .reel-models/SadTalker --python .reel-avatar/bin/python
      - name: Compose and archive labelled vertical reel
        run: |
          .reel-image/bin/python scripts/reel_show.py compose
      - name: Check artifact publication boundary
        id: pnh_publication_1
        env:
          PNH_OUTPUT_PATHS: |
            out/chat-reel/
        run: python3 scripts/security_checks.py --outputs-env PNH_OUTPUT_PATHS
      - name: Upload temporary video artifact, never commit to repository
        if: ${{ steps.pnh_publication_1.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: chat-reel-${{ github.run_id }}
          path: out/chat-reel/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
