name: Parallel broadcast prototype
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  PIP_CONSTRAINT: ${{ github.workspace }}/requirements-constraints.txt

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      segments: ${{ steps.matrix.outputs.segments }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: python3 scripts/analyze_topics.py
      - run: python3 scripts/build_broadcast_plan.py
      - id: matrix
        run: |
          python3 -c 'import json; print("segments="+json.dumps([x["id"] for x in json.load(open("broadcast-plan.json"))["segments"]]))' >> "$GITHUB_OUTPUT"
      - name: Check artifact publication boundary
        id: pnh_publication_1
        env:
          PNH_OUTPUT_PATHS: |
            broadcast-plan.json
        run: python3 scripts/security_checks.py --outputs-env PNH_OUTPUT_PATHS
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: ${{ steps.pnh_publication_1.outcome == 'success' }}
        with:
          name: broadcast-plan
          path: broadcast-plan.json
  render:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        segment: ${{ fromJSON(needs.prepare.outputs.segments) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: broadcast-plan
      - name: Install FFmpeg, fonts and neural speech engine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core
          python3 -m pip install --disable-pip-version-check piper-tts pillow
      - name: Download German Piper voice
        run: |
          mkdir -p models
          base="https://huggingface.co/rhasspy/piper-voices/resolve/main/de/de_DE/thorsten/high"
          curl -fL --retry 3 --connect-timeout 15 --max-time 180 "$base/de_DE-thorsten-high.onnx" -o models/de_DE-thorsten-high.onnx
          curl -fL --retry 3 --connect-timeout 15 --max-time 60 "$base/de_DE-thorsten-high.onnx.json" -o models/de_DE-thorsten-high.onnx.json
          test -s models/de_DE-thorsten-high.onnx
          test -s models/de_DE-thorsten-high.onnx.json
      - run: python3 scripts/render_segment.py --segment "${{ matrix.segment }}"
      - name: Check artifact publication boundary
        id: pnh_publication_2
        env:
          PNH_OUTPUT_PATHS: |
            rendered/*.mp4
        run: python3 scripts/security_checks.py --outputs-env PNH_OUTPUT_PATHS
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: ${{ steps.pnh_publication_2.outcome == 'success' }}
        with:
          name: rendered-${{ matrix.segment }}
          path: rendered/*.mp4
  assemble:
    needs: [prepare, render]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: broadcast-plan
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: rendered-*
          path: rendered
          merge-multiple: true
      - name: Install FFmpeg for final assembly
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python3 scripts/assemble_segments.py
      - name: Check artifact publication boundary
        id: pnh_publication_3
        env:
          PNH_OUTPUT_PATHS: |
            parallel-demo.mp4
        run: python3 scripts/security_checks.py --outputs-env PNH_OUTPUT_PATHS
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: ${{ steps.pnh_publication_3.outcome == 'success' }}
        with:
          name: parallel-broadcast-demo
          path: parallel-demo.mp4
