name: Render regression
on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'assets/**'
      - 'config.json'
      - 'config.example.json'
      - 'config.schema.json'
      - 'requirements.txt'
      - '.github/workflows/render-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install offline rendering tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python3 -m pip install --disable-pip-version-check Pillow -r requirements.txt
      - name: Test full production layout and regressions
        env:
          PNH_RENDER_SECONDS: '155'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests -v
