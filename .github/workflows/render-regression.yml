name: Render regression
on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'assets/**'
      - 'config.json'
      - 'config.example.json'
      - 'config.shows.example.json'
      - 'config.schema.json'
      - 'requirements.txt'
      - '.github/workflows/render-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  PIP_CONSTRAINT: ${{ github.workspace }}/requirements-constraints.txt

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install offline rendering tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python3 -m venv .ci-venv
          .ci-venv/bin/python -m pip install -c requirements-constraints.txt --disable-pip-version-check Pillow -r requirements.txt
      - name: Test full production layout and regressions
        env:
          PNH_RENDER_SECONDS: '155'
          PYTHONDONTWRITEBYTECODE: '1'
        run: sudo unshare --net -- env PNH_RENDER_SECONDS="$PNH_RENDER_SECONDS" PYTHONDONTWRITEBYTECODE=1 "$PWD/.ci-venv/bin/python" scripts/check_repository.py
