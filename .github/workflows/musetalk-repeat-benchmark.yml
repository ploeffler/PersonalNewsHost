name: MuseTalk repeated CPU benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repeat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install CPU dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch
          python3 -m pip install --disable-pip-version-check diffusers transformers huggingface_hub accelerate safetensors
      - name: Repeated real UNet measurements
        shell: bash
        run: |
          mkdir -p musetalk-repeat
          set -o pipefail
          timeout 660s python3 -u - <<'PY' 2>&1 | tee musetalk-repeat/run.log
          import json,statistics,time,traceback,resource
          from pathlib import Path
          report={"model":"MuseTalk 1.5 UNet","device":"cpu","input":"synthetic audio embeddings; no actual lip sync","measurements":[]}
          destination=Path("musetalk-repeat/report.json")
          try:
              import torch
              from diffusers import UNet2DConditionModel
              from huggingface_hub import hf_hub_download
              torch.manual_seed(7)
              weights_path=hf_hub_download("TMElyralab/MuseTalk",filename="musetalkV15/unet.pth")
              config_path=hf_hub_download("TMElyralab/MuseTalk",filename="musetalkV15/musetalk.json")
              model=UNet2DConditionModel.from_config(json.loads(Path(config_path).read_text())).float().eval()
              weights=torch.load(weights_path,map_location="cpu",weights_only=True)
              model.load_state_dict(weights.get("state_dict",weights),strict=True)
              dim=model.config.cross_attention_dim
              if isinstance(dim,(list,tuple)):dim=dim[0]
              for side,threads in [(16,4),(32,4),(32,2)]:
                  torch.set_num_threads(threads)
                  sample=torch.randn(1,model.config.in_channels,side,side)
                  audio=torch.randn(1,50,int(dim))
                  entry={"latent_side":side,"threads":threads,"warmups":2,"repeats":5}
                  with torch.inference_mode():
                      for _ in range(2):model(sample,torch.tensor([0]),encoder_hidden_states=audio)
                      times=[]
                      for _ in range(5):
                          t=time.perf_counter()
                          model(sample,torch.tensor([0]),encoder_hidden_states=audio)
                          times.append(round(time.perf_counter()-t,4))
                  entry["seconds"]=times
                  entry["median_seconds"]=round(statistics.median(times),4)
                  entry["mean_seconds"]=round(statistics.mean(times),4)
                  entry["estimated_unet_only_seconds_for_10s_at_5fps"]=round(entry["median_seconds"]*50,1)
                  report["measurements"].append(entry)
                  destination.write_text(json.dumps(report,indent=2)+"\n")
                  print(entry,flush=True)
              report["status"]="success"
          except Exception as exc:
              report["status"]="failed"
              report["error"]=repr(exc)
              traceback.print_exc()
          report["max_rss_kb"]=resource.getrusage(resource.RUSAGE_SELF).ru_maxrss
          destination.write_text(json.dumps(report,indent=2)+"\n")
          if report["status"]!="success":raise SystemExit(1)
          PY
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: musetalk-repeat-benchmark
          path: musetalk-repeat/
          retention-days: 3
