name: Sync documentation to GitHub Wiki

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/guide/**'
      - '.github/workflows/wiki-sync.yml'

permissions:
  contents: read

concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out documentation
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check Wiki credential
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          if [ -z "$WIKI_TOKEN" ]; then
            echo "::error::Missing WIKI_TOKEN. Add a GitHub token with write access to this repository's wiki under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Publish documentation pages
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wiki"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$WIKI_TOKEN" | base64 -w0)" \
            clone "https://github.com/${GH_REPOSITORY}.wiki.git" "$RUNNER_TEMP/wiki"
          cd "$RUNNER_TEMP/wiki"
          python3 - "$GITHUB_WORKSPACE/docs/guide" <<'PY'
          import pathlib
          import re
          import shutil
          import sys

          source = pathlib.Path(sys.argv[1])
          mapping = {
              "index.md": "Home.md",
              "installation.md": "Installation.md",
              "konfiguration.md": "Konfiguration.md",
              "betrieb-und-sicherheit.md": "Betrieb-und-Sicherheit.md",
              "technik.md": "Technik.md",
              "entwicklung.md": "Entwicklung.md",
          }
          for src, dest in mapping.items():
              text = (source / src).read_text(encoding="utf-8")
              for old, new in mapping.items():
                  text = text.replace(f"]({old})", f"]({new})")
              # Relative links to repository files resolve differently in a wiki.
              text = re.sub(r'\]\((?:\.\./)+([^):#]+)\)', lambda m: '](' + 'https://github.com/' + 'ploeffler/PersonalNewsHost/blob/main/' + m.group(1) + ')', text)
              pathlib.Path(dest).write_text(text, encoding="utf-8")
          pathlib.Path("_Sidebar.md").write_text(
              "\n".join(f"- [{label}]({filename})" for label, filename in [
                  ("Startseite", "Home.md"),
                  ("Installation", "Installation.md"),
                  ("Konfiguration", "Konfiguration.md"),
                  ("Betrieb und Sicherheit", "Betrieb-und-Sicherheit.md"),
                  ("Technik", "Technik.md"),
                  ("Entwicklung", "Entwicklung.md"),
              ]) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Home.md Installation.md Konfiguration.md Betrieb-und-Sicherheit.md Technik.md Entwicklung.md _Sidebar.md
          if git diff --cached --quiet; then
            echo "Wiki already up to date."
            exit 0
          fi
          git commit -m "Synchronize PersonalNewsHost documentation"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$WIKI_TOKEN" | base64 -w0)" push origin HEAD
