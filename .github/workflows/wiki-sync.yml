name: Sync documentation to GitHub Wiki

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Already completed subversion tag, for example v0.1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out documentation
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - name: Require confirmed completed subversion
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          python3 scripts/check_documentation_release.py --tag "$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/Full-featured-Newsoutlet

      - name: Render release workflow graphics
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends graphviz
          python3 scripts/render_workflow_diagrams.py --release-tag "$RELEASE_TAG"

      - name: Check Wiki credential
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          if [ -z "$WIKI_TOKEN" ]; then
            echo "::error::Missing WIKI_TOKEN. Add a GitHub token with write access to this repository's wiki under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Publish documentation pages
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          DOC_RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wiki"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$WIKI_TOKEN" | base64 -w0)" \
            clone "https://github.com/${GH_REPOSITORY}.wiki.git" "$RUNNER_TEMP/wiki"
          cd "$RUNNER_TEMP/wiki"
          python3 - "$GITHUB_WORKSPACE/docs/guide" <<'PY'
          import pathlib
          import os
          import shutil
          import re
          import sys

          source = pathlib.Path(sys.argv[1])
          mapping = {
              "index.md": "Home.md",
              "installation.md": "Installation.md",
              "konfiguration.md": "Konfiguration.md",
              "betrieb-und-sicherheit.md": "Betrieb-und-Sicherheit.md",
              "technik.md": "Technik.md",
              "entwicklung.md": "Entwicklung.md",
          }
          assets = source / "assets" / "workflows"
          if assets.is_dir():
              shutil.copytree(assets, pathlib.Path("assets/workflows"), dirs_exist_ok=True)
          for src, dest in mapping.items():
              text = (source / src).read_text(encoding="utf-8")
              for old, new in mapping.items():
                  text = text.replace(f"]({old})", f"]({new.removesuffix('.md')})")
              # Relative links to repository files resolve differently in a wiki.
              text = re.sub(r'\]\((?:\.\./)+([^):#]+)\)', lambda m: '](' + 'https://github.com/' + os.environ['GH_REPOSITORY'] + '/blob/' + os.environ['DOC_RELEASE_TAG'] + '/' + m.group(1) + ')', text)
              text = text.replace(
                  "](assets/workflows/",
                  "](https://raw.githubusercontent.com/wiki/" + os.environ["GH_REPOSITORY"] + "/assets/workflows/",
              )
              pathlib.Path(dest).write_text(text, encoding="utf-8")
          pathlib.Path("_Sidebar.md").write_text(
              "\n".join(f"- [{label}]({filename.removesuffix('.md')})" for label, filename in [
                  ("Startseite", "Home.md"),
                  ("Installation", "Installation.md"),
                  ("Konfiguration", "Konfiguration.md"),
                  ("Betrieb und Sicherheit", "Betrieb-und-Sicherheit.md"),
                  ("Technik", "Technik.md"),
                  ("Entwicklung", "Entwicklung.md"),
              ]) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Home.md Installation.md Konfiguration.md Betrieb-und-Sicherheit.md Technik.md Entwicklung.md _Sidebar.md
          if [ -d assets/workflows ]; then git add assets/workflows; fi
          if git diff --cached --quiet; then
            echo "Wiki already up to date."
            exit 0
          fi
          git commit -m "Synchronize PersonalNewsHost documentation"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$WIKI_TOKEN" | base64 -w0)" push origin HEAD
