name: Avatar CPU feasibility test
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  PIP_CONSTRAINT: ${{ github.workspace }}/requirements-constraints.txt

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install local video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Install Piper
        run: python3 -m pip install --disable-pip-version-check piper-tts pillow numpy
      - name: Download same high-quality voice as news
        run: |
          mkdir -p models
          base="https://huggingface.co/rhasspy/piper-voices/resolve/main/de/de_DE/thorsten/high"
          curl -fL --retry 3 "$base/de_DE-thorsten-high.onnx" -o models/de_DE-thorsten-high.onnx
          curl -fL --retry 3 "$base/de_DE-thorsten-high.onnx.json" -o models/de_DE-thorsten-high.onnx.json
      - name: Run isolated avatar render benchmark
        run: python3 scripts/avatar_probe.py
      - name: Generate experimental audio-reactive mouth preview
        run: python3 scripts/mouth_motion_probe.py
      - name: Check artifact publication boundary
        id: pnh_publication_1
        env:
          PNH_OUTPUT_PATHS: |
            avatar-test/
        run: python3 scripts/security_checks.py --outputs-env PNH_OUTPUT_PATHS
      - name: Upload diagnostic report and preview
        if: ${{ steps.pnh_publication_1.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: avatar-feasibility
          path: avatar-test/
          retention-days: 1
