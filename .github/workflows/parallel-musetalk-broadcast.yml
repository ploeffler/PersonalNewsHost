name: Parallel broadcast with MuseTalk intro and outro (experimental)
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  PIP_CONSTRAINT: ${{ github.workspace }}/requirements-constraints.txt

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      segments: ${{ steps.matrix.outputs.segments }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: python3 scripts/analyze_topics.py
      - run: python3 scripts/build_broadcast_plan.py
      - id: matrix
        run: |
          python3 -c 'import json; print("segments="+json.dumps([x["id"] for x in json.load(open("broadcast-plan.json"))["segments"]]))' >> "$GITHUB_OUTPUT"
      - name: Check artifact publication boundary
        id: pnh_publication_1
        env:
          PNH_OUTPUT_PATHS: |
            broadcast-plan.json
        run: python3 scripts/security_checks.py --outputs-env PNH_OUTPUT_PATHS
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: ${{ steps.pnh_publication_1.outcome == 'success' }}
        with:
          name: broadcast-plan
          path: broadcast-plan.json
  render:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        segment: ${{ fromJSON(needs.prepare.outputs.segments) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: broadcast-plan
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core
      - name: Determine segment renderer
        id: engine
        env:
          SEGMENT: ${{ matrix.segment }}
        run: |
          python3 -c 'import json,os; p=json.load(open("broadcast-plan.json")); print("renderer="+next(x["render_engine"] for x in p["segments"] if x["id"]==os.environ["SEGMENT"]))' >> "$GITHUB_OUTPUT"
      - name: Install Piper and MuseTalk CPU dependencies
        run: |
          if [[ "${{ steps.engine.outputs.renderer }}" == "musetalk" ]]; then
            python3 -m pip install -c requirements-constraints.txt --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch torchvision
            python3 -m pip install -c requirements-constraints.txt --disable-pip-version-check 'diffusers>=0.30,<0.37' 'transformers>=4.40,<5' accelerate safetensors huggingface_hub pillow numpy librosa soundfile opencv-python-headless einops omegaconf face-alignment piper-tts
          else
            python3 -m pip install -c requirements-constraints.txt --disable-pip-version-check piper-tts pillow
          fi
      - name: Download German Piper voice
        run: |
          mkdir -p models
          base="https://huggingface.co/rhasspy/piper-voices/resolve/main/de/de_DE/thorsten/high"
          curl -fL --retry 3 --connect-timeout 15 --max-time 180 "$base/de_DE-thorsten-high.onnx" -o models/de_DE-thorsten-high.onnx
          curl -fL --retry 3 --connect-timeout 15 --max-time 60 "$base/de_DE-thorsten-high.onnx.json" -o models/de_DE-thorsten-high.onnx.json
          test -s models/de_DE-thorsten-high.onnx
          test -s models/de_DE-thorsten-high.onnx.json
      - name: Render segment
        run: |
          if [[ "${{ steps.engine.outputs.renderer }}" == "musetalk" ]]; then
            timeout 1600s python3 -u scripts/render_musetalk_segment.py --segment "${{ matrix.segment }}"
          else
            python3 scripts/render_segment.py --segment "${{ matrix.segment }}"
          fi
      - name: Check artifact publication boundary
        id: pnh_publication_2
        if: always()
        env:
          PNH_OUTPUT_PATHS: |
            rendered/*.mp4
            musetalk-render/report.json
        run: python3 scripts/security_checks.py --outputs-env PNH_OUTPUT_PATHS
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: ${{ (always()) && steps.pnh_publication_2.outcome == 'success' }}
        with:
          name: rendered-${{ matrix.segment }}
          path: |
            rendered/*.mp4
            musetalk-render/report.json
          if-no-files-found: error
  assemble:
    needs: [prepare, render]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: broadcast-plan
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: rendered-*
          path: downloaded
          merge-multiple: false
      - name: Collect segment MP4 files
        run: |
          mkdir -p rendered
          for segment in intro story-01 story-02 story-03 story-04 story-05 outro; do
            file="downloaded/rendered-${segment}/rendered/${segment}.mp4"
            if [ ! -s "$file" ]; then
              echo "::error::Missing segment video: $file"
              find downloaded -type f -print
              exit 1
            fi
            cp "$file" "rendered/${segment}.mp4"
          done
          ls -lh rendered/*.mp4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python3 scripts/assemble_segments.py
      - name: Check artifact publication boundary
        id: pnh_publication_3
        env:
          PNH_OUTPUT_PATHS: |
            parallel-demo.mp4
        run: python3 scripts/security_checks.py --outputs-env PNH_OUTPUT_PATHS
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: ${{ steps.pnh_publication_3.outcome == 'success' }}
        with:
          name: musetalk-parallel-broadcast-demo
          path: parallel-demo.mp4
          retention-days: 3
