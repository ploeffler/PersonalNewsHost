name: Delete old Telegram videos
on:
  workflow_dispatch:
  schedule:
    - cron: '42 * * * *'
permissions:
  contents: write
concurrency:
  group: personalnewshost-publish
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Delete Telegram messages older than 25 hours
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_SECONDARY: ${{ secrets.TELEGRAM_CHAT_ID_SECONDARY }}
        run: python3 scripts/cleanup_telegram.py
      - name: Persist deletion ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -f telegram_sent.json ]; then exit 0; fi
          git add telegram_sent.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Telegram deletion ledger"
            git push
          fi
