name: MuseTalk hybrid 5 FPS inference to 25 FPS
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  PIP_CONSTRAINT: ${{ github.workspace }}/requirements-constraints.txt

jobs:
  official-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install tools and CPU libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng
          python3 -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python3 -m pip install --disable-pip-version-check 'diffusers>=0.30,<0.37' 'transformers>=4.40,<5' accelerate safetensors huggingface_hub pillow numpy librosa soundfile opencv-python-headless einops omegaconf face-alignment
      - name: Generate 25 MuseTalk frames and interpolate to 125 at 25 FPS
        shell: bash
        run: |
          mkdir -p musetalk-hybrid-interpolation
          set -o pipefail
          timeout 1020s python3 -u - <<'PY' 2>&1 | tee musetalk-hybrid-interpolation/run.log
          import gc,json,resource,subprocess,traceback
          from pathlib import Path
          out=Path("musetalk-hybrid-interpolation")
          report={"device":"cpu","pipeline":"MuseTalk 1.5 five-fps inference and FFmpeg optical flow interpolation","full_official_inference":False}
          try:
              import torch, numpy as np, cv2
              from PIL import Image
              from huggingface_hub import hf_hub_download
              torch.set_num_threads(4)
              subprocess.run(["git","clone","--depth","1","https://github.com/TMElyralab/MuseTalk.git","/tmp/official-musetalk"],check=True)
              import sys
              sys.path.insert(0,"/tmp/official-musetalk")
              from musetalk.utils.audio_processor import AudioProcessor
              from musetalk.models.unet import PositionalEncoding, UNet
              from musetalk.models.vae import VAE
              from transformers import WhisperModel
              speech="Guten Abend. Hier sind die Nachrichten. Heute berichten wir über die wichtigsten Ereignisse aus aller Welt. Zunächst ein Überblick über die aktuelle Lage. Anschließend folgen Meldungen aus Wissenschaft, Wirtschaft und Gesellschaft."
              subprocess.run(["espeak-ng","-v","de","-s","125","-w",str(out/"speech-long.wav"),speech],check=True)
              import soundfile as sf
              audio_data,audio_rate=sf.read(str(out/"speech-long.wav"))
              report["raw_speech_seconds"]=round(len(audio_data)/audio_rate,3)
              if len(audio_data)<5*audio_rate:
                  raise RuntimeError("Speech is shorter than five seconds; cannot benchmark 125 distinct audio-conditioned frames")
              sf.write(str(out/"speech.wav"),audio_data[:5*audio_rate],audio_rate)
              report["speech_seconds"]=5.0
              ap=AudioProcessor(feature_extractor_path="openai/whisper-tiny")
              features,audio_length=ap.get_audio_feature(str(out/"speech.wav"))
              whisper=WhisperModel.from_pretrained("openai/whisper-tiny").eval()
              with torch.inference_mode():
                  chunks=ap.get_whisper_chunk(features,"cpu",torch.float32,whisper,audio_length,fps=5)
                  conditioned=PositionalEncoding(d_model=384)(chunks[:1])
              report["official_audio_chunks"]=list(chunks.shape)
              report["official_positional_encoding"]=list(conditioned.shape)
              del whisper,features,ap,chunks
              gc.collect()
              model_dir=Path("/tmp/official-vae")
              model_dir.mkdir(exist_ok=True)
              for fname in ["config.json","diffusion_pytorch_model.bin"]:
                  source=hf_hub_download(repo_id="stabilityai/sd-vae-ft-mse",filename=fname)
                  (model_dir/fname).symlink_to(source)
              vae=VAE(model_path=str(model_dir))
              im=np.array(Image.open("assets/presenter.png").convert("RGB"))[:,:,::-1].copy()
              x1,y1,x2,y2=730,105,949,400
              face=cv2.resize(im[y1:y2,x1:x2],(256,256))
              Image.fromarray(cv2.cvtColor(face,cv2.COLOR_BGR2RGB)).save(out/"source-face.png")
              with torch.inference_mode():
                  latents=vae.get_latents_for_unet(face)
              report["official_vae_latents"]=list(latents.shape)
              report["official_vae_latents_finite"]=bool(torch.isfinite(latents).all())
              report["official_mask"]="upper half retained, lower half zero before [-1,1] normalization"
              unet_weights=hf_hub_download(repo_id="TMElyralab/MuseTalk",filename="musetalkV15/unet.pth")
              unet_config=hf_hub_download(repo_id="TMElyralab/MuseTalk",filename="musetalkV15/musetalk.json")
              net=UNet(unet_config=unet_config,model_path=unet_weights,device=torch.device("cpu"))
              net.model.eval()
              import time
              frames_dir=out/"frames"
              frames_dir.mkdir(exist_ok=True)
              target_frames=25
              report["target_frames"]=target_frames
              report["neural_fps"]=5
              report["output_fps"]=25
              # Rebuild all official audio chunks after the Whisper stage has been released.
              ap=AudioProcessor(feature_extractor_path="openai/whisper-tiny")
              features,audio_length=ap.get_audio_feature(str(out/"speech.wav"))
              whisper=WhisperModel.from_pretrained("openai/whisper-tiny").eval()
              with torch.inference_mode():
                  chunks=ap.get_whisper_chunk(features,"cpu",torch.float32,whisper,audio_length,fps=5)
                  all_audio=PositionalEncoding(d_model=384)(chunks)
              del whisper,features,ap,chunks
              gc.collect()
              original=Image.open("assets/presenter.png").convert("RGB")
              import PIL.ImageFilter
              mask=Image.new("L",(256,256),0)
              from PIL import ImageDraw
              ImageDraw.Draw(mask).ellipse((45,105,212,247),fill=255)
              mask=mask.filter(PIL.ImageFilter.GaussianBlur(13))
              start=time.monotonic()
              report["available_audio_frames"]=len(all_audio)
              if len(all_audio)<target_frames:
                  raise RuntimeError(f"Only {len(all_audio)} audio-conditioned frames available, need {target_frames}")
              for idx in range(target_frames):
                  with torch.inference_mode():
                      predicted=net.model(latents,torch.tensor([0]),encoder_hidden_states=all_audio[idx:idx+1]).sample
                      reconstructed=vae.decode_latents(predicted)[0]
                  generated=Image.fromarray(cv2.cvtColor(reconstructed,cv2.COLOR_BGR2RGB))
                  blended=Image.composite(generated,Image.fromarray(cv2.cvtColor(face,cv2.COLOR_BGR2RGB)),mask)
                  full=original.copy()
                  full.paste(blended.resize((x2-x1,y2-y1)),(x1,y1))
                  full.thumbnail((960,540))
                  full.save(frames_dir/f"frame-{idx:03d}.png")
                  print("Official MuseTalk frame",idx+1,flush=True)
              report["frames"]=target_frames
              report["complete_five_seconds"]=report["frames"]==target_frames
              report["unet_decode_seconds"]=round(time.monotonic()-start,3)
              subprocess.run(["ffmpeg","-y","-loglevel","error","-framerate","5","-i",str(frames_dir/"frame-%03d.png"),"-i",str(out/"speech.wav"),"-vf","scale=trunc(iw/2)*2:trunc(ih/2)*2,tpad=stop_mode=clone:stop_duration=1,minterpolate=fps=25:mi_mode=mci:mc_mode=obmc:me_mode=bidir,trim=duration=5,setpts=PTS-STARTPTS","-frames:v","125","-t","5","-c:v","libx264","-pix_fmt","yuv420p","-c:a","aac",str(out/"official-speaking-presenter.mp4")],check=True)
              report["video_generated"]=True
              report["unet_decode_seconds_per_frame"]=round(report["unet_decode_seconds"]/max(1,report["frames"]),3)
              report["fps"]=25
              report["interpolated_frames"]=True
              report["neural_frames"]=target_frames
              report["output_frames_target"]=125
              probe=json.loads(subprocess.check_output(["ffprobe","-v","error","-select_streams","v:0","-count_frames","-show_entries","stream=nb_read_frames,r_frame_rate,duration","-of","json",str(out/"official-speaking-presenter.mp4")],text=True))
              report["output_video_probe"]=probe
              actual_frames=int(probe["streams"][0]["nb_read_frames"])
              report["output_frames_actual"]=actual_frames
              if actual_frames!=125:
                  raise RuntimeError(f"Encoded {actual_frames} frames instead of 125")
              report["visual_quality_verified"]=False
              report["status"]="success" if report["complete_five_seconds"] else "error"
          except Exception as exc:
              report["status"]="error"
              report["error"]=repr(exc)
              traceback.print_exc()
          report["max_rss_kb"]=resource.getrusage(resource.RUSAGE_SELF).ru_maxrss
          (out/"report.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2),flush=True)
          if report["status"]=="error":raise SystemExit(1)
          PY
      - name: Assemble experimental presenter intro and published bulletin
        run: python3 scripts/build_hybrid_demo.py
      - name: Check artifact publication boundary
        id: pnh_publication_1
        if: always()
        env:
          PNH_OUTPUT_PATHS: |
            musetalk-hybrid-interpolation/
        run: python3 scripts/security_checks.py --outputs-env PNH_OUTPUT_PATHS
      - name: Upload hybrid interpolation video and report
        if: ${{ (always()) && steps.pnh_publication_1.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: musetalk-hybrid-interpolation
          path: musetalk-hybrid-interpolation/
          retention-days: 3
