name: Analyze RSS topic overlap
on:
  workflow_dispatch:
permissions:
  contents: write
env:
  PIP_CONSTRAINT: ${{ github.workspace }}/requirements-constraints.txt

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install configuration validation
        run: python3 -m pip install -c requirements-constraints.txt --disable-pip-version-check -r requirements.txt
      - name: Validate configuration
        run: python3 scripts/validate_config.py
      - name: Run regression tests
        run: python3 -m unittest discover -s tests
      - name: Compare RSS articles across sources
        run: python3 scripts/analyze_topics.py --output topic-analysis.json --bilingual-output bilingual-review.json
      - name: Build review-aware broadcast plan
        run: python3 scripts/build_broadcast_plan.py --analysis topic-analysis.json --output broadcast-plan.json
      - name: Publish editorial review JSON to GitHub Pages
        if: success()
        run: |
          cp bilingual-review.json docs/bilingual-review.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/bilingual-review.json
          if ! git diff --cached --quiet; then
            git commit -m "Update bilingual editorial review data"
            git push
          fi
      - name: Check artifact publication boundary
        id: pnh_publication_1
        if: always()
        env:
          PNH_OUTPUT_PATHS: |
            topic-analysis.json
            bilingual-review.json
            broadcast-plan.json
        run: python3 scripts/security_checks.py --outputs-env PNH_OUTPUT_PATHS
      - name: Upload topic report
        if: ${{ (always()) && steps.pnh_publication_1.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rss-topic-analysis
          path: |
            topic-analysis.json
            bilingual-review.json
            broadcast-plan.json
          retention-days: 3
