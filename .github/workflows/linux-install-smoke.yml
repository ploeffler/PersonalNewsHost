name: Linux installation smoke
on:
  push:
    branches: [Full-featured-Newsoutlet]
    paths: ['scripts/**', 'requirements*.txt', 'tests/linux_install_smoke.py', '.github/workflows/linux-install-smoke.yml']
  pull_request:
    paths: ['scripts/**', 'requirements*.txt', 'tests/linux_install_smoke.py', '.github/workflows/linux-install-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ubuntu-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Prepare OS prerequisites on fresh runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git ffmpeg espeak-ng fonts-dejavu-core python3-venv
      - name: Install isolated core without model downloads
        run: python3 scripts/install_linux.py --install
      - name: Repeat install, preserve data, render and serve fixture edition
        run: .venv-pnh/bin/python tests/linux_install_smoke.py
