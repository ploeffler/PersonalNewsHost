name: MuseTalk audio-conditioned UNet CPU test
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  PIP_CONSTRAINT: ${{ github.workspace }}/requirements-constraints.txt

jobs:
  conditioned-unet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install CPU dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng
          python3 -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch
          python3 -m pip install --disable-pip-version-check 'transformers>=4.40,<5' diffusers huggingface_hub accelerate safetensors librosa soundfile numpy
      - name: Run real speech through Whisper and MuseTalk UNet
        shell: bash
        run: |
          mkdir -p musetalk-conditioned
          set -o pipefail
          timeout 650s python3 -u - <<'PY' 2>&1 | tee musetalk-conditioned/run.log
          import json,time,traceback,resource,subprocess,math
          from pathlib import Path
          report={"device":"cpu","model":"MuseTalk 1.5 UNet","audio_model":"openai/whisper-tiny","real_audio_conditioning":True,"actual_lip_sync_generated":False}
          try:
              import torch,librosa
              from transformers import AutoFeatureExtractor,WhisperModel
              from huggingface_hub import hf_hub_download
              from diffusers import UNet2DConditionModel
              torch.set_num_threads(4)
              phrase="Guten Abend. Hier sind die Nachrichten."
              subprocess.run(["espeak-ng","-v","de","-s","140","-w","musetalk-conditioned/speech.wav",phrase],check=True)
              audio,sr=librosa.load("musetalk-conditioned/speech.wav",sr=16000)
              report["audio_seconds"]=round(len(audio)/sr,3)
              extractor=AutoFeatureExtractor.from_pretrained("openai/whisper-tiny")
              whisper=WhisperModel.from_pretrained("openai/whisper-tiny").eval()
              with torch.inference_mode():
                  feat=extractor(audio,sampling_rate=16000,return_tensors="pt").input_features
                  hidden=whisper.encoder(feat,output_hidden_states=True).hidden_states
                  stacked=torch.stack(hidden,dim=2)
              # MuseTalk 1.5 uses 50 time steps by 384 channels:
              # 10 Whisper ticks * 5 encoder hidden layers at 25 fps.
              # Test the first window only, not a rendered video.
              conditioning=stacked[:,0:10,:,:].reshape(1,50,384).contiguous()
              report["conditioning_shape"]=list(conditioning.shape)
              ckpt=hf_hub_download("TMElyralab/MuseTalk",filename="musetalkV15/unet.pth")
              config=hf_hub_download("TMElyralab/MuseTalk",filename="musetalkV15/musetalk.json")
              model=UNet2DConditionModel.from_config(json.loads(Path(config).read_text())).float().eval()
              state=torch.load(ckpt,map_location="cpu",weights_only=True)
              if "state_dict" in state:state=state["state_dict"]
              model.load_state_dict(state,strict=True)
              report["cross_attention_dim"]=model.config.cross_attention_dim
              # This input is synthetic image latents: the output is NOT a face.
              sample=torch.randn(1,model.config.in_channels,16,16)
              start=time.perf_counter()
              with torch.inference_mode():
                  output=model(sample,torch.tensor([0]),encoder_hidden_states=conditioning).sample
              report["unet_seconds"]=round(time.perf_counter()-start,3)
              report["output_shape"]=list(output.shape)
              report["output_finite"]=bool(torch.isfinite(output).all().item())
              report["status"]="success" if report["output_finite"] else "invalid_output"
          except Exception as exc:
              report["status"]="error"
              report["error"]=repr(exc)
              traceback.print_exc()
          report["max_rss_kb"]=resource.getrusage(resource.RUSAGE_SELF).ru_maxrss
          Path("musetalk-conditioned/report.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2),flush=True)
          if report["status"]!="success":raise SystemExit(1)
          PY
      - name: Check artifact publication boundary
        id: pnh_publication_1
        if: always()
        env:
          PNH_OUTPUT_PATHS: |
            musetalk-conditioned/
        run: python3 scripts/security_checks.py --outputs-env PNH_OUTPUT_PATHS
      - name: Upload diagnostics
        if: ${{ (always()) && steps.pnh_publication_1.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: musetalk-conditioned-unet
          path: musetalk-conditioned/
          retention-days: 3
